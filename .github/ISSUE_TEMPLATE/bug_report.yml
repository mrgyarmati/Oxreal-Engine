name: Bug report
description: Something is broken or behaves incorrectly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not** report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, project or asset if possible.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Oxreal version / commit
      placeholder: e.g. 0.1.0 or commit e15d9ad
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu
        - Fedora
        - Arch Linux
        - Other Linux (specify below)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      description: Required for rendering issues. Linux - also say Wayland or X11.
      placeholder: e.g. AMD RX 9070 XT, Adrenalin 26.x / Mesa 26.x RADV, Wayland
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Output Log, console output, validation-layer messages, backtraces.
      render: text
