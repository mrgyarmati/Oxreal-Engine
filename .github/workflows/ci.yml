name: CI

# Runs on every push to main and every pull request. Must stay green on all platforms (ADR-0002).
#
# Supply-chain policy:
# - Third-party actions are pinned to full commit SHAs (version in a trailing comment).
#   Dependabot (.github/dependabot.yml) proposes updates.
# - Runner images are pinned explicitly (no *-latest) so image migrations are deliberate changes.
# - The Rust toolchain is pinned by rust-toolchain.toml.
#
# Job names are required status checks in the `main` branch ruleset (matched by exact name).
# Renaming a job means updating the ruleset in the same change (docs/development/coding-standards.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  build-test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows 10/11 and Ubuntu LTS releases (PRD §5). Fedora/Arch are validated
        # separately until containerized jobs are added.
        os: [windows-2025, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux windowing/Vulkan dev packages are added here when platform/rendering crates land
      # (list maintained in docs/development/setup.md).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Optional features (application logging, Tracy profiling) must build and pass too.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo xtask layers
      - run: cargo xtask changelog check
      # Shader compilation with the pinned, hash-verified Slang (ADR-0013). The download is
      # cached per manifest; `xtask slang install` re-verifies the hash either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/downloads
          key: slang-${{ runner.os }}-${{ hashFiles('tools/slang.json') }}
      - run: cargo xtask slang install
      - name: spirv-val for shader validation (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends spirv-tools
      # Windows has no spirv-tools package, so spirv-val comes from the LunarG Vulkan SDK
      # (ADR-0019 §5). The installer is pinned by version and SHA-256. The hash was computed
      # from the download, whose LunarG Authenticode signature was checked, when it was pinned.
      # To update: download the new installer, check its signature, and replace both values.
      # It installs copy-only (no registry changes, no admin rights) into the runner's temp
      # directory. The download is cached outside .tools/downloads, which the Slang cache owns.
      - name: Cache the Vulkan SDK installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/vulkan-sdk-installer
          key: vulkan-sdk-installer-windows-1.4.363.1
      - name: spirv-val for shader validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_SDK_VERSION: "1.4.363.1"
          VULKAN_SDK_SHA256: "c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dir = '.tools/vulkan-sdk-installer'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $installer = Join-Path $dir "vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          if (-not (Test-Path $installer)) {
            Invoke-WebRequest -OutFile $installer `
              -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($hash -ne $env:VULKAN_SDK_SHA256) {
            Remove-Item $installer
            throw "Vulkan SDK installer SHA-256 is $hash, expected $env:VULKAN_SDK_SHA256"
          }
          $root = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          $process = Start-Process -FilePath (Resolve-Path $installer) -Wait -PassThru -ArgumentList `
            '--root', $root, '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1'
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK install failed with exit code $($process.ExitCode)" }
          & (Join-Path $root 'Bin\spirv-val.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'spirv-val did not run' }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Every platform has spirv-val now, so validation must not be skipped anywhere. The cook
      # tests (ADR-0019 §4) need it.
      - name: Shader compiler, cook and renderer round-trip tests (pinned Slang, spirv-val)
        env:
          OXREAL_REQUIRE_SPIRV_VAL: "1"
        # bash stops at the first failing command on every OS; a multi-line pwsh step wouldn't.
        shell: bash
        run: |
          cargo test -p oxreal-shader-compiler --test compile --test cook --locked -- --ignored
          cargo test -p oxreal-renderer --test round_trip --test shader_layout --locked -- --ignored
      # The developer command end to end: cargo xtask -> oxreal-shader-tool -> the cook.
      - name: Cook the workspace's shaders
        run: cargo xtask cook-shaders
      # Opens a real window and runs 120 frames (ADR-0015 §7). The build steps above ran with
      # no windowing dev packages; here only the runtime libraries and a virtual X server are
      # installed. The example fails (never hangs) if frames stop arriving.
      - name: Window smoke test (Linux, X11 under Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxrandr2 libxi6
          OXREAL_LINUX_DISPLAY=x11 xvfb-run -a cargo run -p oxreal-window --example smoke --locked -- --frames 120
      - name: Window smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo run -p oxreal-window --example smoke --locked -- --frames 120

  # Checks the required Vulkan features (ADR-0012, ADR-0016) against Mesa's Lavapipe, the
  # software Vulkan device CI renders with (D-19). The list lives in
  # tools/ci/required-vulkan-features.txt.
  vulkan-features:
    name: vulkan (lavapipe, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      # Load only Lavapipe, the driver this job tests. mesa-vulkan-drivers also installs manifests
      # for GPUs the runner doesn't have. Loaders before 1.4.350 unload those inside
      # vkEnumeratePhysicalDevices under a different lock than the one
      # vkSetDebugUtilsObjectNameEXT (on any other instance) holds while walking them, so parallel
      # GPU tests, one instance each, crash. On Ubuntu 26.04 (loader 1.4.341) that was 11 of 100
      # runs with every driver, and 0 of 100 with this setting. Fixed upstream in
      # KhronosGroup/Vulkan-Loader#1866 (issue #1863). See docs/development/setup.md,
      # "Known upstream issues".
      VK_LOADER_DRIVERS_SELECT: "*lvp*"
      # Synchronization validation on top of the core checks: missing or wrong barriers become
      # errors, which fail every GPU test and example. The engine requests it through
      # VkValidationFeaturesEXT, which every layer version honours, and instance creation fails if
      # the layer can't provide it, so it can't be silently off.
      OXREAL_VULKAN_SYNC_VALIDATION: "1"
      # Shader code the tests hand to the driver must pass spirv-val (ShaderCode's safety
      # contract), so a missing spirv-val is a failure here.
      OXREAL_REQUIRE_SPIRV_VAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lavapipe, vulkaninfo, spirv-val, jq, Xvfb and X11 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools \
            spirv-tools xvfb jq libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxrandr2 libxi6
      # Validation runs with the LunarG SDK's layer, the version Windows development uses, not
      # the distribution's. Ubuntu 24.04's layer (1.3.275) corrupts its own object tracking when
      # one device is destroyed while another thread uses a different device: the parallel GPU
      # tests crashed inside it, or it reported live objects as unknown (5 crashes and 1 bogus
      # error in 30 focused stress runs; 0 in 30 with this layer, and 0 in 60 on Ubuntu 26.04).
      # One pinned layer also means every job applies the same validation rules. The archive is
      # pinned by version and SHA-256 (LunarG publishes the hash), and checked on every run,
      # cached or not. Only the layer (manifest and library) is extracted. VK_LAYER_PATH
      # replaces the loader's explicit-layer search path, so no other copy can be found. See
      # docs/development/setup.md, "Known upstream issues". To update: download the new
      # archive, compare its hash with LunarG's published one, and replace both values. The
      # download is cached outside .tools/downloads, which the Slang cache owns.
      - name: Cache the Vulkan SDK archive (Linux)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/vulkan-sdk-archive
          key: vulkan-sdk-archive-linux-1.4.363.1
      - name: Validation layer from the LunarG Vulkan SDK
        env:
          VULKAN_SDK_VERSION: "1.4.363.1"
          VULKAN_SDK_SHA256: "b7867d8ca658563813af666f34b93db87f1b1c7d9d69d97e924c210c7ba33eb8"
        run: |
          archive=".tools/vulkan-sdk-archive/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          if [ ! -f "$archive" ]; then
            mkdir -p "$(dirname "$archive")"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o "$archive" \
              "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          fi
          echo "$VULKAN_SDK_SHA256  $archive" | sha256sum --check --strict || { rm "$archive"; exit 1; }
          root="$RUNNER_TEMP/vulkan-validation-layer"
          mkdir -p "$root"
          tar -xJf "$archive" -C "$root" --strip-components=1 \
            "$VULKAN_SDK_VERSION/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" \
            "$VULKAN_SDK_VERSION/x86_64/lib/libVkLayer_khronos_validation.so"
          manifest_dir="$root/x86_64/share/vulkan/explicit_layer.d"
          version=$(jq -r '.layer.api_version' "$manifest_dir/VkLayer_khronos_validation.json")
          echo "validation layer $version"
          [ "$version" = "${VULKAN_SDK_VERSION%.*}" ] || { echo "expected ${VULKAN_SDK_VERSION%.*}"; exit 1; }
          # The manifest must load the library extracted next to it, not whatever the dynamic
          # linker finds by name: a relative path resolves against the manifest's directory.
          # Plain assignments, so `bash -e` stops the step if either path doesn't exist.
          library=$(jq -r '.layer.library_path' "$manifest_dir/VkLayer_khronos_validation.json")
          loaded=$(realpath -e "$manifest_dir/$library")
          extracted=$(realpath -e "$root/x86_64/lib/libVkLayer_khronos_validation.so")
          [ "$loaded" = "$extracted" ] \
            || { echo "manifest library_path '$library' doesn't point at the extracted layer"; exit 1; }
          echo "VK_LAYER_PATH=$manifest_dir" >> "$GITHUB_ENV"
      - run: bash tools/ci/check-vulkan-features.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The triangle pixel tests and example compile Slang with the pinned compiler (ADR-0013).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/downloads
          key: slang-${{ runner.os }}-${{ hashFiles('tools/slang.json') }}
      - run: cargo xtask slang install
      # GPU tests (ignored by default) on Lavapipe with validation enabled. Any validation error
      # fails them (ADR-0012 §5). They include offscreen pixel tests of the first triangle and
      # the regression tests of its unsafe audit.
      - name: Vulkan device tests (Lavapipe, validation on)
        run: cargo test -p oxreal-rhi-vulkan --locked -- --ignored
      # The renderer on a real device: shaders cooked for the test, offscreen draws read back
      # (ADR-0019 §5).
      - name: Renderer GPU tests (Lavapipe, validation on)
        run: cargo test -p oxreal-renderer --test gpu --locked -- --ignored
      - name: device_info example (Lavapipe)
        run: cargo run -p oxreal-rhi-vulkan --example device_info --locked
      # The whole frame loop on a real (virtual X11) window: surface, swapchain, clears,
      # presentation. It fails on any validation error or if frames stop arriving.
      - name: clear example (Lavapipe, X11 under Xvfb)
        timeout-minutes: 10
        run: OXREAL_LINUX_DISPLAY=x11 xvfb-run -a cargo run -p oxreal-rhi-vulkan --example clear --locked -- --frames 120
      - name: triangle example (Lavapipe, X11 under Xvfb)
        timeout-minutes: 10
        run: OXREAL_LINUX_DISPLAY=x11 xvfb-run -a cargo run -p oxreal-rhi-vulkan --example triangle --locked -- --frames 120
      - name: textured example (Lavapipe, X11 under Xvfb)
        timeout-minutes: 10
        run: OXREAL_LINUX_DISPLAY=x11 xvfb-run -a cargo run -p oxreal-rhi-vulkan --example textured --locked -- --frames 120
      # The game executable end to end (ADR-0019 §5): cook the shaders, then run the player,
      # which loads them from `cooked/` next to itself and fails on any validation error or if
      # frames stop arriving.
      - name: Cook shaders
        run: cargo xtask cook-shaders
      - name: player (Lavapipe, X11 under Xvfb)
        timeout-minutes: 10
        run: OXREAL_LINUX_DISPLAY=x11 xvfb-run -a cargo run -p oxreal-player --locked -- --frames 120
      # Misusing the frame loop (second begin_frame, dropped frame, tampered Frame, ...) is
      # refused or recovered, never undefined behaviour.
      - name: frame_protocol checks (Lavapipe, X11 under Xvfb)
        timeout-minutes: 10
        run: OXREAL_LINUX_DISPLAY=x11 xvfb-run -a cargo run -p oxreal-rhi-vulkan --example frame_protocol --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --document-private-items --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
