# TEMPORARY: diagnoses a SIGSEGV in the triangle tests on Lavapipe / Ubuntu 26.04 (PR #24).
# This branch is never merged.
name: debug-segfault
on:
  pull_request:
permissions:
  contents: read
jobs:
  segfault:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools vulkan-validationlayers gdb
          dpkg -l | grep -E "mesa-vulkan|vulkan-validationlayers|libvulkan1" | awk '{print $2, $3}'
      - run: cargo xtask slang install
      - name: build
        shell: bash
        run: |
          bin=$(cargo test -p oxreal-rhi-vulkan --test triangle --no-run --locked --message-format=json | jq -r 'select(.executable != null) | .executable' | tail -1)
          echo "binary: $bin"; echo "bin=$bin" >> "$GITHUB_ENV"
      - name: parallel suite 60x at full speed, core dumps on
        shell: bash
        run: |
          set +e +o pipefail
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p >/dev/null
          crashes=0
          for i in $(seq 1 60); do
            "$bin" --ignored > /tmp/run.log 2>&1; code=$?
            if [ $code -ne 0 ]; then
              crashes=$((crashes+1)); echo "=== run $i: exit $code"; tail -15 /tmp/run.log
            fi
          done
          echo "crashes: $crashes / 60"
          ls -la /tmp/core.* 2>/dev/null | head
      - name: backtraces from core dumps
        shell: bash
        run: |
          set +e
          for core in $(ls /tmp/core.* 2>/dev/null | head -3); do
            echo "=== $core"
            gdb -q -batch -ex "set pagination off" -ex "info threads" -ex "thread apply all bt 30" "$bin" "$core" 2>&1 \
              | grep -vE "^warning: |auto-load|libthread_db" | head -250
          done
      - name: again with validation layers off (layer or driver?)
        shell: bash
        run: |
          set +e +o pipefail
          crashes=0
          for i in $(seq 1 60); do
            OXREAL_VULKAN_VALIDATION=0 "$bin" --ignored > /tmp/run.log 2>&1 || { crashes=$((crashes+1)); tail -3 /tmp/run.log; }
          done
          echo "crashes without validation (assertions may fail by design): $crashes / 60"
