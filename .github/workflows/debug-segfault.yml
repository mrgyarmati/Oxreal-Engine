# TEMPORARY: diagnoses a SIGSEGV in the triangle tests on Lavapipe / Ubuntu 26.04 (PR #24).
# This branch is never merged.
name: debug-segfault
on:
  pull_request:
permissions:
  contents: read
jobs:
  segfault:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools vulkan-validationlayers gdb
          dpkg -l | grep -E "mesa-vulkan|vulkan-validationlayers|libvulkan1" | awk '{print $2, $3}'
      - run: cargo xtask slang install
      - name: build
        shell: bash
        run: |
          bin=$(cargo test -p oxreal-rhi-vulkan --test triangle --no-run --locked --message-format=json | jq -r 'select(.executable != null) | .executable' | tail -1)
          echo "binary: $bin"; echo "bin=$bin" >> "$GITHUB_ENV"
      - name: which driver manifests are installed
        run: ls /usr/share/vulkan/icd.d/
      - name: control, 100 parallel runs, all drivers
        shell: bash
        run: |
          set +e +o pipefail
          segv=0; other=0
          for i in $(seq 1 100); do "$bin" --ignored > /tmp/run.log 2>&1; c=$?; [ $c -eq 139 ] && segv=$((segv+1)); [ $c -ne 0 ] && [ $c -ne 139 ] && other=$((other+1)); done
          echo "ALL DRIVERS: SIGSEGV $segv / 100, other failures $other"
      - name: 100 parallel runs, Lavapipe selected
        shell: bash
        env:
          VK_LOADER_DRIVERS_SELECT: "*lvp*"
        run: |
          set +e +o pipefail
          "$bin" --ignored --exact triangle_points_up_and_has_its_corner_colors --nocapture 2>&1 | grep -iE "GPU found|llvmpipe" | head -3
          segv=0; other=0
          for i in $(seq 1 100); do "$bin" --ignored > /tmp/run.log 2>&1; c=$?; [ $c -eq 139 ] && segv=$((segv+1)); [ $c -ne 0 ] && [ $c -ne 139 ] && { other=$((other+1)); tail -5 /tmp/run.log; }; done
          echo "LAVAPIPE SELECTED: SIGSEGV $segv / 100, other failures $other"
