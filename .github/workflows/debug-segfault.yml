# TEMPORARY: diagnoses a SIGSEGV in the triangle tests on Lavapipe / Ubuntu 26.04 (PR #24).
# This branch is never merged.
name: debug-segfault
on:
  pull_request:
permissions:
  contents: read
jobs:
  segfault:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools vulkan-validationlayers gdb
          dpkg -l | grep -E "mesa-vulkan|vulkan-validationlayers|libvulkan1" | awk '{print $2, $3}'
      - run: cargo xtask slang install
      - name: build
        shell: bash
        run: |
          bin=$(cargo test -p oxreal-rhi-vulkan --test triangle --no-run --locked --message-format=json | jq -r 'select(.executable != null) | .executable' | tail -1)
          echo "binary: $bin"; echo "bin=$bin" >> "$GITHUB_ENV"
      - name: parallel suite 60x at full speed, core dumps on
        shell: bash
        run: |
          set +e +o pipefail
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p >/dev/null
          crashes=0
          for i in $(seq 1 60); do
            "$bin" --ignored > /tmp/run.log 2>&1; code=$?
            if [ $code -ne 0 ]; then
              crashes=$((crashes+1)); echo "=== run $i: exit $code"; tail -15 /tmp/run.log
            fi
          done
          echo "crashes: $crashes / 60"
          ls -la /tmp/core.* 2>/dev/null | head
      - name: crashing thread only, with loaded libraries
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          for core in $(ls /tmp/core.* 2>/dev/null | head -4); do
            echo "=== $core"
            gdb -q -batch -ex "set pagination off" -ex "bt 40" -ex "info symbol \$pc" "$bin" "$core" > /tmp/gdb.txt 2>&1
            grep -vE "^warning: |auto-load|libthread_db|^\[New LWP" /tmp/gdb.txt | head -60
          done
      - name: same loop with validation layers off (count only SIGSEGV, exit 139)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          segv=0
          for i in $(seq 1 60); do
            OXREAL_VULKAN_VALIDATION=0 "$bin" --ignored > /tmp/run.log 2>&1; [ $? -eq 139 ] && segv=$((segv+1))
          done
          echo "SIGSEGV without validation layers: $segv / 60"
      - name: same loop, device creation only (tests/device.rs, 2 threads)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          dev=$(cargo test -p oxreal-rhi-vulkan --test device --no-run --locked --message-format=json 2>/dev/null | jq -r 'select(.executable != null) | .executable' | tail -1)
          segv=0
          for i in $(seq 1 60); do "$dev" --ignored > /tmp/run.log 2>&1; [ $? -eq 139 ] && segv=$((segv+1)); done
          echo "SIGSEGV in device tests: $segv / 60"
