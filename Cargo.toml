[workspace]
resolver = "3"
# Explicit member list: crates are added only when they have real code
# (docs/architecture/TAD.md §7). Use the `new-crate` skill, which also records the layer.
members = [
    # foundation
    "crates/foundation/diagnostics",
    "crates/foundation/math",
    # platform
    "crates/platform/window",
    # runtime
    "crates/runtime/ecs",
    "crates/runtime/hierarchy",
    # rendering
    "crates/rendering/rhi",
    "crates/rendering/backends/vulkan",
    "crates/rendering/renderer",
    # systems
    "crates/systems/input",
    # tools
    "crates/tools/shader-compiler",
    "applications/shader-tool",
    "tools/xtask",
]

[workspace.package]
# One unified SemVer version for every Oxreal crate (ADR-0009). `main` carries the next
# release with a `-dev` suffix; a release commit drops it and is tagged `vX.Y.Z`.
version = "0.1.0-dev"
edition = "2024"
# Equals the toolchain pinned in rust-toolchain.toml; raising it is a `changed` changelog entry.
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrgyarmati/Oxreal-Engine"
publish = false

[workspace.dependencies]
# Third-party versions are centralized here. Every entry must be listed in
# docs/development/dependencies.md with an audit result.
serde_json = "1"
# xtask only: verifying and unpacking pinned tool downloads (ADR-0013).
flate2 = "1.1.11"
sha2 = "0.11.1"
tar = "0.4.46"

# Math (ADR-0011): f32 core types plus f64 (future large worlds) and i32/u32 vectors only.
glam = { version = "0.34.3", default-features = false, features = ["std", "f64", "i32", "u32"] }

# Windowing (ADR-0015): winit 0.30 stable line. Linux libraries are loaded at runtime (dlopen).
# `-notitle` decorations avoid ab_glyph -> ttf-parser (unmaintained, RUSTSEC-2026-0192).
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }
raw-window-handle = "0.6.2"

# Vulkan backend (ADR-0012): runtime-loaded loader; allocator with the Vulkan backend only.
ash = { version = "0.38.0", default-features = false, features = ["loaded", "debug", "std"] }
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
ash-window = "0.13.0"

# Errors and diagnostics (ADR-0010).
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
    "smallvec",
    "tracing-log",
] }
# Tracy client: no default features, so no network broadcast, system tracing or crash handler.
# Collects only while a viewer is connected, and listens on localhost only.
tracy-client = { version = "0.19.0", default-features = false, features = [
    "enable",
    "ondemand",
    "only-localhost",
] }

# Workspace crates. Each one's layer is checked by `cargo xtask layers`.
oxreal-diagnostics = { path = "crates/foundation/diagnostics" }
oxreal-ecs = { path = "crates/runtime/ecs" }
oxreal-hierarchy = { path = "crates/runtime/hierarchy" }
oxreal-math = { path = "crates/foundation/math" }
oxreal-input = { path = "crates/systems/input" }
oxreal-shader-compiler = { path = "crates/tools/shader-compiler" }
oxreal-rhi = { path = "crates/rendering/rhi" }
oxreal-rhi-vulkan = { path = "crates/rendering/backends/vulkan" }
oxreal-window = { path = "crates/platform/window" }

# Lint policy: docs/development/coding-standards.md. CI runs clippy with `-D warnings`, so every
# "warn" here fails CI. Suppress a lint only with `#[expect(lint, reason = "...")]`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# unsafe must be justified and contracts documented (conventions.md).
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# Public fallible and panicking functions document how (`# Errors`, `# Panics`).
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Lint suppressions must say why. Prefer `expect`, which also fails when it goes stale.
allow_attributes_without_reason = "warn"
# No debugging leftovers or unfinished code in main.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Libraries log through oxreal-diagnostics, never print.
print_stdout = "warn"
print_stderr = "warn"
# Library code returns errors instead of panicking on fallible paths.
unwrap_used = "warn"
mem_forget = "warn"

# Optimize third-party dependencies in debug builds; workspace crates stay fully debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
