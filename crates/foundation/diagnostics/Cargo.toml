[package]
name = "oxreal-diagnostics"
description = "Logging and profiling for Oxreal: re-exported log macros, zero-cost profiling macros, and application-side setup (ADR-0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.engine]
layer = "foundation"

[features]
default = []
# Installs the global log subscriber. Only applications and tools (app-*, tool layers) may enable
# this; libraries must never install global state (ADR-0010).
application = ["dep:tracing-subscriber", "dep:thiserror"]
# Tracy profiling backend. Off by default; profiling builds opt in. Configured on-demand and
# localhost-only, with no network broadcast (ADR-0010 §3).
profile-tracy = ["dep:tracy-client"]

[dependencies]
tracing.workspace = true
thiserror = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }

[lints]
workspace = true
