[package]
name = "oxreal-rhi-vulkan"
description = "Vulkan 1.3 backend of the Oxreal RHI: instance, validation, GPU selection, device and memory allocator (ADR-0012, ADR-0016)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.engine]
layer = "rendering"

[dependencies]
ash.workspace = true
ash-window.workspace = true
gpu-allocator.workspace = true
oxreal-diagnostics.workspace = true
oxreal-rhi.workspace = true
raw-window-handle.workspace = true

[dev-dependencies]
oxreal-ecs.workspace = true
oxreal-input.workspace = true
oxreal-math.workspace = true
oxreal-shader-compiler.workspace = true
oxreal-window.workspace = true
oxreal-diagnostics = { workspace = true, features = ["application"] }

# The cube example has unit tests (its fly camera), which `cargo test` runs.
[[example]]
name = "cube"
test = true

[lints]
workspace = true
